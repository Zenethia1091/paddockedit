<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Race Reflex</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
body{margin:0;color:#fff;font:16px system-ui,-apple-system,"Segoe UI",sans-serif;max-width:520px;margin:auto;padding:24px 20px 32px;background-color:#0c0e13;background-image:radial-gradient(900px 480px at 50% -12%,#1d2434 0%,transparent 60%),radial-gradient(700px 500px at 110% 110%,#231318 0%,transparent 55%),repeating-linear-gradient(45deg,rgba(255,255,255,.014) 0 2px,transparent 2px 4px);min-height:100vh;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#top{display:flex;justify-content:space-between;align-items:center;color:#9aa3b5;font-size:12px;letter-spacing:.18em}
#lang{padding:7px 14px;font-size:13px;letter-spacing:0;border-radius:999px}
h1{font-style:italic;font-weight:900;letter-spacing:-2px;font-size:44px;margin:10px 0 4px;line-height:1;text-shadow:0 3px 14px rgba(0,0,0,.5)}
h1 em{font-style:italic;background:linear-gradient(92deg,#ff7a5c,#e8321f 60%,#c21807);-webkit-background-clip:text;background-clip:text;color:transparent}
.strip{height:10px;border-radius:2px;margin:10px 0 18px;background:repeating-conic-gradient(#e9e9ec 0% 25%,#14161b 0% 50%);background-size:20px 20px;opacity:.9;box-shadow:0 1px 4px rgba(0,0,0,.5)}
button{font:inherit;color:#fff;background:linear-gradient(180deg,#303644,#242a36);border:1px solid #3c4356;border-radius:12px;padding:16px;touch-action:manipulation;cursor:pointer;box-shadow:0 2px 0 #12151c,inset 0 1px 0 rgba(255,255,255,.07);transition:transform .06s ease,box-shadow .06s ease,background .15s ease,border-color .15s ease;user-select:none;-webkit-user-select:none}
button:active{transform:translateY(1px) scale(.985);box-shadow:0 1px 0 #12151c,inset 0 1px 0 rgba(255,255,255,.05)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#menu button.active{background:linear-gradient(180deg,#f2492f,#cf2a15);border-color:#ff7a5c;box-shadow:0 2px 0 #7e1505,0 0 16px rgba(232,50,31,.35)}
#daily{margin:12px 0;width:100%;padding:12px}
#daily.on{border-color:#c9a86a;color:#f0d9a0}
#stats{display:flex;justify-content:space-between;align-items:center;color:#aeb6c6;font-size:13px;letter-spacing:.06em;min-height:18px}
#arena{position:relative;overflow:hidden;min-height:260px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;margin:14px 0;background:linear-gradient(180deg,#181d27,#11141b);border:1px solid #28303f;border-radius:18px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 -18px 30px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.35)}
#arena>*:not(.confetti){animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#message{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;font-weight:600;padding:0 6px}
#message .nb{background:linear-gradient(180deg,#ffd968,#e3a812);color:#231a02;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:800;letter-spacing:.05em;box-shadow:0 0 14px rgba(245,197,66,.5);animation:pop .35s ease both}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
#action{width:100%;font-weight:800;font-size:21px;letter-spacing:.04em;padding:18px;background:linear-gradient(180deg,#f2492f,#cf2a15);border-color:#ff7a5c;box-shadow:0 3px 0 #7e1505,0 0 18px rgba(232,50,31,.30)}
#action.go{background:linear-gradient(180deg,#35c26f,#1d9e57);border-color:#5fe39a;animation:glowpulse .55s ease-in-out infinite alternate}
@keyframes glowpulse{from{box-shadow:0 3px 0 #0d5c31,0 0 8px rgba(61,220,132,.35)}to{box-shadow:0 3px 0 #0d5c31,0 0 26px rgba(61,220,132,.75)}}
#share{width:100%;margin-top:8px;padding:12px}
.lights{display:flex;gap:10px;width:100%;background:#08090c;border:1px solid #2b303d;border-radius:16px;padding:16px 14px;box-shadow:inset 0 3px 10px #000,inset 0 -1px 0 rgba(255,255,255,.05)}
.light{flex:1;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4b5262,#2a2f3b 72%);box-shadow:inset 0 -4px 7px rgba(0,0,0,.55),inset 0 2px 3px rgba(255,255,255,.10);transition:background .07s ease,box-shadow .07s ease}
.light.red{background:radial-gradient(circle at 35% 30%,#ff9a86,#e8321f 62%,#a81c0c);box-shadow:0 0 20px 5px rgba(255,62,35,.55),inset 0 -4px 7px rgba(0,0,0,.35)}
.big{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;text-shadow:0 3px 14px rgba(0,0,0,.45);transition:color .12s ease,text-shadow .12s ease}
.big.live{color:#3ddc84;text-shadow:0 0 22px rgba(61,220,132,.5)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.grid button{aspect-ratio:1;padding:0;font-weight:800;font-size:17px}
.grid button.lit{background:linear-gradient(180deg,#3ecf7f,#1f9d57)!important;border-color:#6fe8a4!important;color:#08130c!important;box-shadow:0 0 16px rgba(57,188,135,.55)}
.grid button.target{animation:targetpulse .45s ease-in-out infinite alternate}
@keyframes targetpulse{from{box-shadow:0 0 6px rgba(57,188,135,.4)}to{box-shadow:0 0 22px rgba(57,188,135,.9)}}
.mem button{border-radius:16px;font-size:19px;transition:background .12s ease,box-shadow .12s ease,transform .12s ease}
.mem button.lit{transform:scale(1.05)}
.track{width:120px;height:230px;position:relative;background:linear-gradient(180deg,#3e444f,#30353f);overflow:hidden;border-radius:6px;box-shadow:inset 0 0 24px rgba(0,0,0,.45)}
.track::before,.track::after{content:"";position:absolute;top:0;bottom:0;width:9px;background:repeating-linear-gradient(180deg,#d8402e 0 12px,#e8e6df 12px 24px)}
.track::before{left:0}.track::after{right:0}
.zone{position:absolute;top:65px;height:48px;left:14px;right:14px;border:2px solid #49e2a0;border-radius:4px;background:rgba(73,226,160,.07);box-shadow:0 0 14px rgba(73,226,160,.35),inset 0 0 14px rgba(73,226,160,.18)}
.zone::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed rgba(73,226,160,.65)}
.car{position:absolute;width:34px;height:58px;left:43px;border-radius:13px 13px 6px 6px;background:linear-gradient(180deg,#ff7a5f,#e03318 55%,#b81f0a);box-shadow:0 8px 12px rgba(0,0,0,.5)}
.car::before{content:"";position:absolute;top:-4px;left:-7px;right:-7px;height:8px;background:#22262f;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.car::after{content:"";position:absolute;bottom:-4px;left:-8px;right:-8px;height:9px;background:#22262f;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.car i{position:absolute;display:block}
.car .w{width:7px;height:15px;background:#0a0b0e;border-radius:3px}
.car .fl{left:-6px;top:7px}.car .fr{right:-6px;top:7px}.car .rl{left:-6px;bottom:7px}.car .rr{right:-6px;bottom:7px}
.car .cp{left:8px;right:8px;top:15px;height:19px;border-radius:9px;background:radial-gradient(circle at 50% 35%,#bfe6ff,#2c5f8a 72%);box-shadow:inset 0 -2px 4px rgba(0,0,0,.4)}
.car .st{left:15px;right:15px;top:0;bottom:0;background:rgba(255,255,255,.28);border-radius:3px}
.car .tl{left:7px;right:7px;bottom:3px;height:4px;border-radius:2px;background:#5c130a;transition:background .08s,box-shadow .08s}
.car.braked .tl{background:#ff3b26;box-shadow:0 0 12px 4px rgba(255,59,38,.85)}
.confetti{position:absolute;top:42%;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:6}
.small{font-size:12px;color:#98a1b3;line-height:1.5}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style><div id="top"><span>INDEPENDENT MOTORSPORT ARCADE</span><button id="lang">中文</button></div><h1>RACE<em>REFLEX</em></h1><div class="strip"></div><div id="menu"></div><button id="daily"></button><div id="stats"><span id="score"></span><span id="best"></span></div><div id="arena"></div><div id="message" role="status"></div><button id="action"></button><button id="share"></button><p class="small" id="note"></p><script>
(()=>{const $=id=>document.getElementById(id),A=$('arena'),B=$('action'),M=$('message');let zh=false,mode=0,state='idle',gen=0,raf=0,timers=[],score=0,target=-1,cells=[],lights=[],start=0,end=0,pos=0,seq=[],idx=0,round=0,lastResult='',daily=false,seed=1;const names=[['Lights Out','发车反应'],['Reflex Rush','极速反应'],['Perfect Pit','精准进站'],['Wheel Memory','方向盘记忆']];const tr=(a,b)=>zh?b:a;const date=()=>new Date().toISOString().slice(0,10);function rand(){if(!daily)return Math.random();seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function later(fn,ms){let g=gen;timers.push(setTimeout(()=>{if(g===gen)fn()},ms))}function clear(){gen++;timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf)}function key(){return 'rr-v2-'+mode+(daily?'-'+date():'')}function read(){try{return JSON.parse(localStorage.getItem(key()))}catch{return null}}function stats(s=''){$('score').textContent=s;$('best').textContent=tr('BEST: ','纪录：')+(read()??'—')}function confetti(){const colors=['#e84232','#f5c542','#39bc87','#4da3ff','#ffffff'];for(let i=0;i<28;i++){let d=document.createElement('div');d.className='confetti';d.style.background=colors[i%colors.length];d.style.left=(50+(Math.random()*44-22))+'%';A.append(d);let dx=(Math.random()*2-1)*150,dy=-(50+Math.random()*110),r=Math.random()*560-280,anim=d.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+dx+'px,'+(dy+190)+'px) rotate('+r+'deg)',opacity:0}],{duration:950+Math.random()*750,easing:'cubic-bezier(.2,.7,.3,1)'});anim.onfinish=()=>d.remove()}}function finish(value,label){clear();state='done';B.classList.remove('go');lastResult=names[mode][0]+' · '+label+(daily?' · '+date():'');let newBest=false;if(value!==null){let old=read();if(old===null||([0,2].includes(mode)?value<old:value>old)){newBest=true;try{localStorage.setItem(key(),JSON.stringify(value))}catch{}}}M.textContent=label;if(newBest){let s=document.createElement('span');s.className='nb';s.textContent=tr('★ NEW BEST','★ 新纪录');M.append(' ',s);confetti()}B.textContent=tr('TRY AGAIN','再来一次');stats(label)}function grid(n,fn){let g=document.createElement('div');g.className='grid';cells=Array.from({length:n},(_,i)=>{let b=document.createElement('button');b.textContent=i+1;b.addEventListener('pointerdown',e=>{e.preventDefault();fn(i)});g.append(b);return b});A.append(g)}function render(){clear();state='idle';A.innerHTML='';B.classList.remove('go');$('menu').innerHTML='';names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n[+zh];b.className=i===mode?'active':'';b.onclick=()=>{mode=i;render()};$('menu').append(b)});$('lang').textContent=zh?'EN':'中文';$('daily').textContent=(daily?'● ':'○ ')+tr('Daily challenge','每日挑战')+' · '+date();$('daily').classList.toggle('on',daily);$('share').textContent=tr('Share last result','分享上次成绩');$('note').textContent=tr('Original arcade challenges. Not affiliated with any racing series. Scores are game results, not professional driver assessments.','原创赛车小游戏，与任何赛车赛事无官方关联。游戏成绩不代表专业车手能力。');B.textContent=tr('START','开始');stats();if(mode===0){A.innerHTML='<div class="lights">'+'<div class="light"></div>'.repeat(5)+'</div><div class="big">0.000</div>';lights=[...A.querySelectorAll('.light')];M.textContent=tr('Tap when all red lights go out.','红灯全部熄灭时立即点击。')}if(mode===1){grid(12,hit);M.textContent=tr('Hit the green targets for 5 seconds.','5秒内点击绿色目标。')}if(mode===2){A.innerHTML='<div class="track"><div class="zone"></div><div class="car" style="top:170px"><i class="st"></i><i class="cp"></i><i class="w fl"></i><i class="w fr"></i><i class="w rl"></i><i class="w rr"></i><i class="tl"></i></div></div>';M.textContent=tr('Brake when the car is centered in the box.','赛车中心到达停车框中心时刹车。')}if(mode===3){grid(8,memory);A.querySelector('.grid').classList.add('mem');M.textContent=tr('Repeat the flashing sequence.','复现按钮闪烁顺序。')}}function next(){let n;do{n=Math.floor(rand()*12)}while(n===target);target=n;cells.forEach((b,i)=>{b.classList.toggle('lit',i===n);b.classList.toggle('target',i===n)})}function hit(i){if(state!=='play')return;if(performance.now()>=end)return;if(i===target){score++;cells[i].animate([{transform:'scale(.9)'},{transform:'scale(1)'}],{duration:120});next()}else{score=Math.max(0,score-1);cells[i].animate([{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:150})}stats(score+' pts')}function showSeq(){state='show';idx=0;seq.push(Math.floor(rand()*8));seq.forEach((n,i)=>{later(()=>cells[n].classList.add('lit'),i*650);later(()=>cells[n].classList.remove('lit'),i*650+400)});later(()=>{state='input';M.textContent=tr('Your turn','轮到你')},seq.length*650)}function memory(i){if(state!=='input')return;if(i!==seq[idx]){finish(round,round+' rounds');return}cells[i].animate([{transform:'scale(.93)'},{transform:'scale(1)'}],{duration:110});idx++;if(idx===seq.length){round++;state='show';stats(round+' rounds');later(showSeq,500)}}function countUp(){if(state!=='go')return;let b=A.querySelector('.big');if(b)b.textContent=((performance.now()-start)/1000).toFixed(3);raf=requestAnimationFrame(countUp)}function act(now){if(state==='done')render();if(state==='waiting'){finish(null,tr('JUMP START','抢跑'));return}if(state==='go'){let ms=Math.round(now-start);A.querySelector('.big').textContent=(ms/1000).toFixed(3);finish(ms,ms+' ms');return}if(mode===2&&state==='play'){pos=190-(now-start)*.13;let car=A.querySelector('.car');if(car){car.style.top=pos+'px';car.classList.add('braked')}let err=Math.round(Math.abs(pos+29-89));finish(err,err+' units');return}if(state!=='idle')return;seed=Number(date().replaceAll('-',''))+mode;score=0;start=now;if(mode===0){state='waiting';B.textContent=tr('LAUNCH','起步');lights.forEach((l,i)=>later(()=>l.classList.add('red'),i*500));later(()=>{lights.forEach(l=>l.classList.remove('red'));state='go';start=performance.now();B.classList.add('go');let b=A.querySelector('.big');if(b)b.classList.add('live');countUp()},2500+rand()*2000)}else if(mode===1){state='play';end=start+5000;next();B.textContent=tr('PLAYING','挑战中');function tick(){let left=end-performance.now();if(left<=0){cells.forEach(b=>b.classList.remove('lit','target'));finish(score,score+' pts');return}stats(score+' pts · '+Math.ceil(left/1000)+'s');raf=requestAnimationFrame(tick)}tick()}else if(mode===2){state='play';B.textContent=tr('BRAKE','刹车');pos=190;function tick(t){pos=190-(t-start)*.13;A.querySelector('.car').style.top=pos+'px';if(pos<-60){finish(null,tr('MISSED','冲过停车位'));return}raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}else{seq=[];round=0;B.textContent=tr('WATCH','观察');showSeq()}}B.addEventListener('pointerdown',e=>{e.preventDefault();act(e.timeStamp)});document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.code!=='Space'&&e.code!=='Enter')return;let a=document.activeElement;if(a&&a.tagName==='BUTTON'&&a!==B)return;e.preventDefault();act(performance.now())});A.addEventListener('contextmenu',e=>e.preventDefault());$('lang').onclick=()=>{zh=!zh;render()};$('daily').onclick=()=>{daily=!daily;render()};$('share').onclick=async()=>{if(!lastResult){M.textContent=tr('Complete a challenge first.','先完成一次挑战。');return}let text='Race Reflex | '+lastResult;try{if(navigator.share)await navigator.share({text});else if(navigator.clipboard)await navigator.clipboard.writeText(text);else M.textContent=text}catch{M.textContent=text}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&state!=='idle'&&state!=='done')render()});render()})();
</script></html>
