<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Race Reflex</title><style>*{box-sizing:border-box}body{margin:0;background:#101217;color:#fff;font:16px system-ui;max-width:520px;margin:auto;padding:24px}h1{font-style:italic;letter-spacing:-2px;font-size:38px;margin:8px 0}em{color:#ff5544}button{font:inherit;color:white;background:#292e38;border:0;border-radius:12px;padding:16px;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:3px solid white}#menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}#menu button.active,#action{background:#e84232}#action{width:100%;font-weight:bold;font-size:20px}#arena{min-height:260px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;margin:16px 0;background:#191d25;border-radius:18px;padding:16px}#stats,#top{display:flex;justify-content:space-between;align-items:center;color:#b8bfcc;font-size:13px}#message{min-height:48px;text-align:center}.lights{display:flex;gap:8px;width:100%}.light{flex:1;aspect-ratio:1;border-radius:50%;background:#353b46}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}.grid button{aspect-ratio:1;padding:0;font-weight:bold}.lit{background:#39bc87!important;color:#101217!important}.red{background:#ff4433!important}.big{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}.track{width:110px;height:220px;position:relative;background:#343942;border-left:3px dashed #aaa;border-right:3px dashed #aaa;overflow:hidden}.zone{position:absolute;top:65px;height:48px;left:5px;right:5px;border:2px solid #49e2a0}.car{position:absolute;width:32px;height:58px;background:#f54c3d;left:36px;border-radius:12px 12px 5px 5px;border-left:7px solid #101217;border-right:7px solid #101217}.small{font-size:12px;color:#aab1bd}#daily{margin:12px 0;width:100%}</style><div id="top"><span>INDEPENDENT MOTORSPORT ARCADE</span><button id="lang">中文</button></div><h1>RACE<em>REFLEX</em></h1><div id="menu"></div><button id="daily"></button><div id="stats"><span id="score"></span><span id="best"></span></div><div id="arena"></div><div id="message" role="status"></div><button id="action"></button><button id="share" style="width:100%;margin-top:8px"></button><p class="small" id="note"></p><script>
(()=>{const $=id=>document.getElementById(id),A=$('arena'),B=$('action'),M=$('message');let zh=false,mode=0,state='idle',gen=0,raf=0,timers=[],score=0,target=-1,cells=[],lights=[],start=0,end=0,pos=0,seq=[],idx=0,round=0,lastResult='',daily=false,seed=1;const names=[['Lights Out','发车反应'],['Reflex Rush','极速反应'],['Pit Stop','极速换胎'],['Perfect Pit','精准进站'],['Wheel Memory','方向盘记忆']];const tr=(a,b)=>zh?b:a;const date=()=>new Date().toISOString().slice(0,10);function rand(){if(!daily)return Math.random();seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function later(fn,ms){let g=gen;timers.push(setTimeout(()=>{if(g===gen)fn()},ms))}function clear(){gen++;timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf)}function key(){return 'rr-v1-'+mode+(daily?'-'+date():'')}function read(){try{return JSON.parse(localStorage.getItem(key()))}catch{return null}}function stats(s=''){ $('score').textContent=s;$('best').textContent=tr('BEST: ','纪录：')+(read()??'—')}function finish(value,label){clear();state='done';lastResult=names[mode][0]+' · '+label+(daily?' · '+date():'');if(value!==null){let old=read();if(old===null||([0,2,3].includes(mode)?value<old:value>old)){try{localStorage.setItem(key(),JSON.stringify(value))}catch{}}}M.textContent=label;B.textContent=tr('TRY AGAIN','再来一次');stats(label)}function grid(n,fn){let g=document.createElement('div');g.className='grid';cells=Array.from({length:n},(_,i)=>{let b=document.createElement('button');b.textContent=i+1;b.onclick=()=>fn(i);g.append(b);return b});A.append(g)}function render(){clear();state='idle';A.innerHTML='';$('menu').innerHTML='';names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n[+zh];b.className=i===mode?'active':'';b.onclick=()=>{mode=i;render()};$('menu').append(b)});$('lang').textContent=zh?'EN':'中文';$('daily').textContent=(daily?'● ':'○ ')+tr('Daily challenge','每日挑战')+' · '+date();$('share').textContent=tr('Share last result','分享上次成绩');$('note').textContent=tr('Original arcade challenges. Not affiliated with any racing series. Scores are game results, not professional driver assessments.','原创赛车小游戏，与任何赛车赛事无官方关联。游戏成绩不代表专业车手能力。');B.textContent=tr('START','开始');stats();if(mode===0){A.innerHTML='<div class="lights">'+ '<div class="light"></div>'.repeat(5)+'</div><div class="big">0.000</div>';lights=[...A.querySelectorAll('.light')];M.textContent=tr('Tap when all red lights go out.','红灯全部熄灭时立即点击。')}if(mode===1){grid(12,hit);M.textContent=tr('Hit the green targets for 30 seconds.','30秒内点击绿色目标。')}if(mode===2){grid(4,pit);M.textContent=tr('Tap each wheel four times in order: loosen, remove, fit, lock.','依次对四个轮胎点击四次：松开、卸下、装上、锁紧。')}if(mode===3){A.innerHTML='<div class="track"><div class="zone"></div><div class="car" style="top:170px"></div></div>';M.textContent=tr('Brake when the car is centered in the box.','赛车中心到达停车框中心时刹车。')}if(mode===4){grid(8,memory);M.textContent=tr('Repeat the flashing sequence.','复现按钮闪烁顺序。')}}function next(){let n;do{n=Math.floor(rand()*12)}while(n===target);target=n;cells.forEach((b,i)=>b.classList.toggle('lit',i===n))}function hit(i){if(state!=='play')return;if(performance.now()>=end)return;score=i===target?score+1:Math.max(0,score-1);if(i===target)next();stats(score+' pts')}function pit(i){if(state!=='play'||i!==Math.floor(score/4))return;score++;cells[i].textContent=['','LOOSE','OFF','ON','LOCK'][((score-1)%4)+1];if(score%4===0)cells[i].classList.add('lit');if(score===16){let ms=Math.round(performance.now()-start);finish(ms,(ms/1000).toFixed(3)+' s')}}function showSeq(){state='show';idx=0;seq.push(Math.floor(rand()*8));seq.forEach((n,i)=>{later(()=>cells[n].classList.add('lit'),i*650);later(()=>cells[n].classList.remove('lit'),i*650+400)});later(()=>{state='input';M.textContent=tr('Your turn','轮到你')},seq.length*650)}function memory(i){if(state!=='input')return;if(i!==seq[idx]){finish(round,round+' rounds');return}idx++;if(idx===seq.length){round++;state='show';stats(round+' rounds');later(showSeq,500)}}B.onclick=()=>{if(state==='done')render();if(state==='waiting'){finish(null,tr('FALSE START','抢跑'));return}if(state==='go'){let ms=Math.round(performance.now()-start);A.querySelector('.big').textContent=(ms/1000).toFixed(3);finish(ms,ms+' ms');return}if(mode===3&&state==='play'){let err=Math.round(Math.abs(pos+29-89));finish(err,err+' units');return}if(state!=='idle')return;seed=Number(date().replaceAll('-',''))+mode;score=0;start=performance.now();if(mode===0){state='waiting';B.textContent=tr('LAUNCH','起步');lights.forEach((l,i)=>later(()=>l.classList.add('red'),i*500));later(()=>{lights.forEach(l=>l.classList.remove('red'));state='go';start=performance.now()},2500+rand()*2000)}else if(mode===1){state='play';end=start+30000;next();B.textContent=tr('PLAYING','挑战中');function tick(){let left=end-performance.now();if(left<=0){cells.forEach(b=>b.classList.remove('lit'));finish(score,score+' pts');return}stats(score+' pts · '+Math.ceil(left/1000)+'s');raf=requestAnimationFrame(tick)}tick()}else if(mode===2){state='play';B.textContent=tr('CHANGE TYRES','换胎中')}else if(mode===3){state='play';B.textContent=tr('BRAKE','刹车');pos=190;function tick(t){pos=190-(t-start)*.13;A.querySelector('.car').style.top=pos+'px';if(pos<-60){finish(null,tr('MISSED','冲过停车位'));return}raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}else{seq=[];round=0;B.textContent=tr('WATCH','观察');showSeq()}};$('lang').onclick=()=>{zh=!zh;render()};$('daily').onclick=()=>{daily=!daily;render()};$('share').onclick=async()=>{if(!lastResult){M.textContent=tr('Complete a challenge first.','先完成一次挑战。');return}let text='Race Reflex | '+lastResult;try{if(navigator.share)await navigator.share({text});else if(navigator.clipboard)await navigator.clipboard.writeText(text);else M.textContent=text}catch{M.textContent=text}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&state!=='idle'&&state!=='done')render()});render()})();</script></html>
